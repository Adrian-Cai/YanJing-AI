version: '3.9'
services:
  web:
    image: node:20
    working_dir: /app
    volumes:
      - ./yanjing-web:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"

  api:
    image: python:3.11
    working_dir: /app
    volumes:
      - ./yanjing-api:/app
    command: sh -c "pip install fastapi uvicorn && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: yanjing
      POSTGRES_USER: yanjing
      POSTGRES_PASSWORD: yanjing
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">YanJing product overview</title>
  <desc id="desc">A visual overview showing resume upload, AI interview practice, and feedback report generation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.55" stop-color="#EEF5FF"/>
      <stop offset="1" stop-color="#DDEAFF"/>
    </linearGradient>
    <linearGradient id="primary" x1="308" y1="95" x2="670" y2="316" gradientUnits="userSpaceOnUse">

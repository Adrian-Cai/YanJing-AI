server:
  port: ${API_PORT:8000}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/yanjing}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
